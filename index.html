<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fceff1">
<meta name="description" content="데일리템픽 - 살림·생활 꿀템 모음. 상품번호나 키워드로 찾아보세요.">
<title>데일리템픽 | 살림·생활 꿀템 모음</title>
<style>
:root{
  --bg:#fceff1;
  --bg2:#fdf3f4;
  --bar1:#d3a7ae;
  --bar2:#c79ea4;
  --ink:#33262a;
  --ink2:#5f4d52;
  --muted:#94797e;
  --line:#d8c6c9;
  --card:#ffffff;
  --shadow:0 3px 12px rgba(150,100,110,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 38%,#fbf0f2 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",
              "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}

/* ── 최상단 쿠팡 파트너스 마퀴 바 ── */
.notice{
  position:sticky;top:0;z-index:40;
  overflow:hidden;
  background:linear-gradient(90deg,var(--bar2),var(--bar1) 55%,var(--bar2));
  color:#3d2a2e;
  height:40px;
  display:flex;align-items:center;
}
.notice__track{
  display:flex;flex:0 0 auto;width:max-content;
  animation:notice-scroll 26s linear infinite;
  will-change:transform;
}
.notice__item{
  display:block;white-space:nowrap;
  font-size:12.5px;font-weight:600;letter-spacing:-.2px;
  padding:0 26px;
}
@keyframes notice-scroll{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(-50%,0,0)}
}
@media (hover:hover){
  .notice:hover .notice__track{animation-play-state:paused}
}
@media (prefers-reduced-motion:reduce){
  .notice__track{animation:none}
}

.wrap{max-width:480px;margin:0 auto;padding:0 16px 60px;position:relative}

/* ── 상단 좌/우 원형 아이콘 ── */
.topicons{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 2px 0;
}
.iconbtn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(231,220,222,.72);
  color:#5b464b;
  display:grid;place-items:center;
  transition:background .15s ease,transform .15s ease;
}
.iconbtn:hover{background:rgba(231,220,222,.95)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{display:block}

.profile{
  display:flex;flex-direction:column;align-items:center;
  margin-top:18px;
}
.avatar{
  width:102px;height:102px;border-radius:50%;
  background:#fff;padding:6px;
  box-shadow:0 6px 20px rgba(190,140,150,.20);
  display:grid;place-items:center;
}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.title{
  margin:18px 0 0;
  font-size:26px;font-weight:800;letter-spacing:-.8px;
  color:#2c2225;
}

/* ── 검색창 ── */
.search{
  margin-top:26px;
  background:#fff;border-radius:14px;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 4px 16px rgba(170,120,130,.10);
  display:flex;align-items:center;
  padding:0 18px;height:48px;
}
.search svg{flex:none;color:#b9a3a8}
.search input{
  width:100%;border:0;outline:0;background:transparent;
  padding:0 12px;font-size:16px;letter-spacing:-.3px;
}
.search input::placeholder{color:#b9a3a8}
.search input::-webkit-search-cancel-button{display:none}

.guide{
  margin:16px 0 0;text-align:center;
  font-size:14.5px;color:var(--ink2);letter-spacing:-.3px;
}
.divider{
  height:0;border:0;border-top:1px dashed var(--line);
  margin:22px -16px 0;
}

/* ── 스마트스토어 배너 카드 ── */
.banner{
  display:flex;align-items:center;gap:14px;
  margin-top:22px;padding:13px 16px;
  background:var(--card);border-radius:16px;
  box-shadow:var(--shadow);
  text-decoration:none;
  transition:transform .15s ease,box-shadow .15s ease;
}
.banner:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(150,100,110,.12)}
.banner__thumb{
  width:60px;height:60px;flex:none;border-radius:12px;
  background:#fdeef1;overflow:hidden;display:grid;place-items:center;
}
.banner__thumb img{width:100%;height:100%;object-fit:cover}
.banner__text{
  flex:1;text-align:center;font-size:15.5px;font-weight:700;
  letter-spacing:-.4px;color:#3a2b2f;
}
.chev{color:#cbb6ba;flex:none;display:grid;place-items:center}

/* ── 상품 리스트 ── */
.count{margin:20px 4px -6px;font-size:12.5px;color:var(--muted);text-align:center;letter-spacing:-.2px}
.count[hidden]{display:none}
.list{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.item{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border-radius:16px;
  padding:14px;box-shadow:var(--shadow);
  text-decoration:none;
  transition:transform .15s ease,box-shadow .15s ease;
}
.item:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(150,100,110,.12)}
.item:active{transform:scale(.995)}
.item__thumb{
  width:70px;height:70px;flex:none;border-radius:12px;
  background:#fdeef1;overflow:hidden;display:grid;place-items:center;
  font-size:28px;
}
.item__thumb img{width:100%;height:100%;object-fit:cover}
.item__body{flex:1;min-width:0;text-align:center}
.item__name{
  font-size:16px;font-weight:700;letter-spacing:-.5px;line-height:1.42;
  color:#2f2428;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin:0 auto;
}
.item__sub{
  margin-top:7px;font-size:14px;color:var(--ink2);letter-spacing:-.3px;
}

.empty{
  margin-top:16px;background:#fff;border-radius:16px;
  padding:52px 22px;text-align:center;box-shadow:var(--shadow);
}
.empty .emoji{font-size:40px}
.empty strong{display:block;margin-top:10px;font-size:17px;letter-spacing:-.5px}
.empty p{margin:8px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}

footer{
  margin-top:38px;text-align:center;
  color:var(--muted);font-size:11.5px;line-height:1.85;letter-spacing:-.2px;
}
footer strong{display:block;color:#6d565b;font-size:12px;margin-bottom:4px;letter-spacing:.5px}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:rgba(58,43,47,.92);color:#fff;
  font-size:13px;padding:11px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  z-index:60;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="notice" role="note" aria-label="쿠팡 파트너스 안내">
  <div class="notice__track">
    <span class="notice__item">📢 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span>
    <span class="notice__item" aria-hidden="true">📢 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span>
  </div>
</div>

<div class="wrap">

  <div class="topicons">
    <button class="iconbtn" id="copyLink" type="button" aria-label="링크 복사" title="링크 복사">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.07 0l2.12-2.12a5 5 0 0 0-7.07-7.07L10.8 5.13"/>
        <path d="M14 11a5 5 0 0 0-7.07 0L4.8 13.12a5 5 0 0 0 7.07 7.07l1.32-1.32"/>
      </svg>
    </button>
    <button class="iconbtn" id="shareBtn" type="button" aria-label="공유" title="공유">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/>
      </svg>
    </button>
  </div>

  <div class="profile">
    <div class="avatar"><img src="./avatar.png" alt="데일리템픽 프로필" width="104" height="104"></div>
    <h1 class="title">데일리템픽</h1>
  </div>

  <label class="search" for="search">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/>
    </svg>
    <input id="search" type="search" placeholder="검색어를 입력하세요" autocomplete="off" aria-label="상품번호 또는 키워드 검색">
  </label>

  <p class="guide">👆🏻 상품번호나 키워드로 검색해주세요 🩷</p>
  <hr class="divider">

  <a class="banner" id="storeBanner" href="#" target="_blank" rel="noopener noreferrer" hidden>
    <span class="banner__thumb"><img src="./avatar.png" alt="" width="58" height="58"></span>
    <span class="banner__text">🏡 모어픽 스마트스토어 바로가기</span>
    <span class="chev">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </span>
  </a>

  <p class="count" id="count"></p>
  <div class="list" id="list" aria-live="polite"></div>

  <footer>
    <strong>MOREPICK · 모어픽</strong>
    <div>상품 구매·결제·배송은 연결된 판매처에서 진행됩니다.</div>
    <div>가격·배송비·구성·재고는 판매처 상세페이지에서 확인해 주세요.</div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./products.js?v=20261127-011c"></script>
<script>
(function(){
"use strict";

const data = window.MOREPICK_DATA || {storeUrl:"", products:[]};
const items = (Array.isArray(data.products) ? data.products : [])
  .filter(p => p && p.name && p.url)
  .slice()
  .sort((a,b) => Number(b.id) - Number(a.id));   // 최신 번호가 위로

const search = document.getElementById("search");
const list = document.getElementById("list");
const count = document.getElementById("count");
const banner = document.getElementById("storeBanner");
const toast = document.getElementById("toast");

function safeUrl(url){
  try{
    const u = new URL(url, location.href);
    return ["https:","http:"].includes(u.protocol) ? u.href : null;
  }catch(e){ return null; }
}
function node(tag, cls, text){
  const el = document.createElement(tag);
  if(cls) el.className = cls;
  if(text !== undefined) el.textContent = text;
  return el;
}
function chevron(){
  const span = node("span","chev");
  span.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
  return span;
}

/* 스마트스토어 배너 */
const storeHref = safeUrl(data.storeUrl);
if(storeHref){ banner.href = storeHref; banner.hidden = false; }

/* 검색 */
let query = "";
function norm(v){ return String(v || "").toLowerCase().replace(/[\s.,·\-()\[\]{}#]/g, ""); }
function matches(p, q){
  if(!q) return true;
  const hay = norm(p.id) + norm(p.name) + norm(p.category);
  return hay.includes(q);
}

function render(){
  const q = norm(query);
  const found = items.filter(p => matches(p, q));
  list.replaceChildren();

  count.textContent = q ? "검색 결과 " + found.length + "개" : "";
  count.hidden = !q;

  if(!found.length){
    const box = node("div","empty");
    box.append(node("div","emoji", "🔎"), node("strong","", "검색 결과가 없어요"),
               node("p","", "다른 상품번호나 키워드로 검색해 보세요."));
    list.append(box);
    return;
  }

  found.forEach(p => {
    const a = node("a","item");
    a.href = safeUrl(p.url) || "#";
    a.target = "_blank";
    a.rel = /coupang\.com/i.test(p.url) ? "noopener noreferrer sponsored" : "noopener noreferrer";
    a.setAttribute("aria-label", p.id + ". " + p.name + " 상품 보기");

    const thumb = node("span","item__thumb");
    const img = safeUrl(p.image);
    if(img){
      const i = node("img"); i.src = img; i.alt = ""; i.loading = "lazy"; i.width = 70; i.height = 70;
      thumb.append(i);
    }else{
      thumb.textContent = "🛍️";
    }

    const body = node("span","item__body");
    body.append(node("span","item__name", p.id + ". " + p.name));

    list.append(a);
    a.append(thumb, body, chevron());
    // 보조문구는 블록으로 (중앙 정렬 유지)
    body.append(node("span","item__sub", "👉 클릭 후 바로 확인"));
  });
}

search.addEventListener("input", () => { query = search.value.trim(); render(); });

/* 링크 복사 / 공유 */
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}
document.getElementById("copyLink").addEventListener("click", async () => {
  const url = location.href;
  try{
    await navigator.clipboard.writeText(url);
    showToast("링크가 복사됐어요 🩷");
  }catch(e){
    const t = document.createElement("textarea");
    t.value = url; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.append(t); t.select();
    try{ document.execCommand("copy"); showToast("링크가 복사됐어요 🩷"); }
    catch(err){ showToast("복사가 안 됐어요. 주소창에서 복사해 주세요."); }
    t.remove();
  }
});
document.getElementById("shareBtn").addEventListener("click", async () => {
  const shareData = { title: document.title, text: "데일리템픽 · 살림 꿀템 모음", url: location.href };
  if(navigator.share){
    try{ await navigator.share(shareData); }catch(e){ /* 사용자가 닫음 */ }
  }else{
    try{ await navigator.clipboard.writeText(location.href); showToast("링크가 복사됐어요 🩷"); }
    catch(e){ showToast("공유를 지원하지 않는 브라우저예요."); }
  }
});

/* 마퀴: 화면 폭에 맞춰 문구를 이어 붙이고, 길이에 비례해 속도를 일정하게 */
(function initMarquee(){
  const bar = document.querySelector(".notice");
  const track = bar && bar.querySelector(".notice__track");
  if(!track) return;
  const base = track.firstElementChild;
  const fill = () => {
    while(track.children.length > 2) track.lastElementChild.remove();
    let guard = 0;
    while(track.scrollWidth < window.innerWidth * 2 && guard++ < 14){
      const c = base.cloneNode(true);
      c.setAttribute("aria-hidden", "true");
      track.append(c);
    }
    if(track.children.length % 2) {
      const c = base.cloneNode(true);
      c.setAttribute("aria-hidden", "true");
      track.append(c);
    }
    const half = track.scrollWidth / 2;
    track.style.animationDuration = Math.round(half / 42) + "s";  // 약 42px/초
  };
  fill();
  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(fill, 200); });
})();

render();
})();
</script>
</body></html>
